name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  select:
    name: Select the platform matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.select.outputs.os }}
    steps:
      # A pull request runs on Linux x64 alone, so that feedback stays fast.
      # A push to main runs every platform that gets a platform-specific gem,
      # because such a gem is only as good as the platform it was tested on.
      - id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","ubuntu-24.04-arm","macos-latest","windows-latest","windows-11-arm"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: select
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
        # Every Ruby that is not end-of-life. 3.2 reached end of life on
        # 2026-03-31.
        ruby: ["3.3", "3.4", "4.0"]
        exclude:
          # RubyInstaller publishes no arm64 build before 3.4, so this pair
          # cannot exist. Nobody can run Ruby 3.3 on Windows arm64 either, so
          # the aarch64-mingw-ucrt gem loses no reachable user.
          - os: windows-11-arm
            ruby: "3.3"

    # Actions are pinned to the commit each release points at. A tag can be
    # moved to another commit, so a tag reference says which version its owner
    # is offering today rather than which code this workflow ran last time.
    #
    # A pinned setup-ruby also fixes the list of Ruby builds it can install,
    # because that list ships inside the action. Bumping the pin is how this
    # repository picks up a newly released Ruby patch version.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # The suite drives the real engine, so the engine has to be here before
      # it runs. A fresh runner has no tmp/libhegel and no
      # HEGEL_LIBHEGEL_PATH, and Hegel::LibHegel::Real would fail to open
      # anything. This step is also the only place the fetch task is
      # exercised on Linux and Windows rather than on a developer's Mac.
      - name: Fetch the pinned libhegel
        run: bundle exec rake libhegel:fetch
      - name: Run the tests and the linter
        run: bundle exec rake
