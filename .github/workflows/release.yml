name: Release

# A merge into main that changes the gem version starts a release. The
# workflow cannot be started by a tag that it pushes itself, because GitHub
# does not start workflows from a push made with the workflow's own token, so
# the tag is the last thing this workflow creates, after the gems are out.
on:
  push:
    branches:
      - main
    paths:
      - lib/hegel/version.rb

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# Three jobs. check finds a gem version that has no tag yet; a change to
# version.rb that keeps a released version, such as a revert, stops there.
# publish runs under the release environment, whose approval is the last
# check before anything goes out, and holds the RubyGems OIDC token. release
# runs only after publish succeeds, creates the tag and the GitHub release,
# and is the only job with contents: write, so the token that can write the
# repository never sits in the job that can push gems.
jobs:
  check:
    name: Find a gem version with no tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the gem version and look for its tag
        id: version
        run: |
          version=$(ruby -e 'puts File.read("lib/hegel/version.rb").slice(/VERSION\s*=\s*"([^"]+)"/, 1)')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, so this push releases nothing"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish the gems
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    # Actions are pinned to the commit each release points at, matching
    # ci.yml. A tag can move to another commit; a pinned commit says which
    # code runs, while a tag says only which version its owner offers today.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # VERSION is exported for every later step to read.
      - name: Read the gem version
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # The suite drives the real engine, so this step fetches every asset
      # before the tests run and before the platform gems build.
      - name: Fetch every platform's libhegel asset
        run: bundle exec rake libhegel:fetch_all

      # ci.yml runs on the same push, but beside this workflow rather than
      # ahead of it, so its result cannot hold a publish back. This step runs
      # the same tests and linter here, on the commit being released, before
      # anything is published.
      - name: Run the tests and the linter
        run: bundle exec rake

      - name: Build the ruby gem
        run: bundle exec rake build

      - name: Build the platform gems
        run: bundle exec rake platform_gems:build

      # This list repeats the published platform names rather than reading
      # them from the library, so it checks the build instead of restating
      # it. A change to that list shows here as a diff in this workflow.
      #
      # The count check is what lets the later steps say pkg/*.gem: it
      # proves the glob holds these six files and nothing else.
      - name: Check that every platform gem was built
        run: |
          for name in \
            "hegeltest-$VERSION.gem" \
            "hegeltest-$VERSION-arm64-darwin.gem" \
            "hegeltest-$VERSION-x86_64-linux.gem" \
            "hegeltest-$VERSION-aarch64-linux.gem" \
            "hegeltest-$VERSION-x64-mingw-ucrt.gem" \
            "hegeltest-$VERSION-aarch64-mingw-ucrt.gem"; do
            if [ ! -f "pkg/$name" ]; then
              echo "missing pkg/$name" >&2
              exit 1
            fi
          done
          set -- pkg/*.gem
          if [ "$#" -ne 6 ]; then
            echo "pkg/ holds $# gems, and this release expects 6" >&2
            printf '%s\n' "$@" >&2
            exit 1
          fi

      # The exchanged token is short lived, so this step runs right before
      # the push rather than earlier in the job.
      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # A job that fails partway through and gets rerun can reach this step
      # after some gems already pushed. RubyGems answers a repeat push for a
      # version already live with "Repushing of gem versions is not
      # allowed". Only that message is worth skipping past. Any other
      # failure still stops the job.
      - name: Push every gem to RubyGems
        run: |
          for path in pkg/*.gem; do
            if output=$(gem push "$path" 2>&1); then
              echo "$output"
              continue
            fi
            echo "$output"
            if echo "$output" | grep -q "Repushing of gem versions is not allowed"; then
              echo "already pushed: $path"
              continue
            fi
            exit 1
          done

  release:
    name: Create the tag and the GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The notes are this version's section of CHANGELOG.md. A link in it
      # is relative to the repository root, which a release page does not
      # resolve, so each one is rewritten to the file at this tag.
      - name: Write the release notes from this version's changelog section
        env:
          TAG: ${{ needs.check.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {in_version=1; next} /^## /{in_version=0} in_version' CHANGELOG.md |
            sed "s#](docs/#](https://github.com/${REPOSITORY}/blob/${TAG}/docs/#g" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      # The assets are fetched back from RubyGems rather than handed over
      # from the publish job, so the release carries the exact files that
      # were published, and no artifact action is needed to pass them on. A
      # gem can take a moment to become downloadable after its push, so
      # each fetch is retried.
      - name: Fetch every published gem
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir pkg
          cd pkg
          for platform in ruby arm64-darwin x86_64-linux aarch64-linux x64-mingw-ucrt aarch64-mingw-ucrt; do
            for attempt in 1 2 3 4 5 6; do
              if gem fetch hegeltest --version "$version" --platform "$platform"; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "could not fetch hegeltest $version for $platform" >&2
                exit 1
              fi
              sleep 10
            done
          done
          set -- *.gem
          if [ "$#" -ne 6 ]; then
            echo "fetched $# gems, and this release expects 6" >&2
            exit 1
          fi

      # `gh release create --target` creates the tag on the merged commit
      # together with the release. A rerun reaches this step with the release
      # already created, and `gh release create` refuses that. Uploading to
      # the existing release and rewriting its notes instead lets a rerun
      # finish the job.
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber pkg/*.gem
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md pkg/*.gem
          fi
