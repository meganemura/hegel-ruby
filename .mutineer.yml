# Equivalent mutants that share a line with a killed mutant of the same
# operator. A `# mutineer:disable-line` marker suppresses every mutant of
# that operator on its line, so these few are ignored by their stable id
# instead (ADR 0018). The reason for each sits in a comment beside the code.
ignore:
  # Hegel::Runner.classify: no caller reads a VALID, INVALID, or OVERRUN
  # tuple past its first two elements.
  - 6f5a56541400 # VALID, third element
  - 87afa9403063 # VALID, fourth element
  - 6dd4d55ae010 # INVALID, third element
  - 825623e39444 # INVALID, fourth element
  - b03a50a3cba2 # OVERRUN, third element
  - d605791ba4d8 # OVERRUN, fourth element
  # Hegel::TestCase#generate_boolean: has_forced is false, so the engine
  # ignores the forced argument's value.
  - 6f98b301248a # forced
